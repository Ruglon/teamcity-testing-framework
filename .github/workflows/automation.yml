name: Run tests

on:
  workflow_call:
    inputs:
      package:
        description: api | ui
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-checkstyle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
      - name: Setup Maven
        run: |
          sudo apt-get update && sudo apt-get install -y maven
          echo "MVN_CMD=mvn" >> $GITHUB_ENV
      - name: Run Checkstyle (do not fail CI)
        run: ${{ env.MVN_CMD }} -B -DskipTests -Dcheckstyle.consoleOutput=true -Dcheckstyle.failOnViolation=false validate
      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report-${{ github.run_attempt }}
          path: |
            **/target/checkstyle-result.xml
            **/target/checkstyle-cachefile
          if-no-files-found: ignore
          overwrite: true

  run-tests:
    needs: validate-checkstyle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Setup Maven
        run: |
          sudo apt-get update && sudo apt-get install -y maven
          echo "MVN_CMD=mvn" >> $GITHUB_ENV

      # Start TeamCity + Selenoid + finish first-start
      - name: TeamCity Setup
        id: setup
        uses: ./.github/actions/teamcity-setup

      # Run tests based on package type
      - name: Run API tests
        if: ${{ inputs.package == 'api' }}
        run: |
          ${{ env.MVN_CMD }} -B \
            -Dcheckstyle.skip=true \
            -Dtest="teamcity.api.**" \
            test

      - name: Run UI tests
        if: ${{ inputs.package == 'ui' }}
        run: |
          ${{ env.MVN_CMD }} -B \
            -Dcheckstyle.skip=true \
            -Dselenide.remote=http://localhost:4444/wd/hub \
            -Dselenide.browser=chrome \
            -Dselenide.headless=true \
            -Dselenide.baseUrl=http://host.docker.internal:8111 \
            -Dtest="teamcity.ui.**" \
            test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.package }}-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/allure-results/**
          if-no-files-found: ignore

