name: TeamCity Setup
description: Start Selenoid, run setup test against local TeamCity, expose token and URLs

# Outputs exposed to the caller workflow
outputs:
  teamcity_url:
    description: "Runner → TeamCity URL"
    value: ${{ steps.expose.outputs.teamcity_url }}
  base_url:
    description: "Browser → TeamCity URL"
    value: ${{ steps.expose.outputs.base_url }}
  selenoid_url:
    description: "Runner → Selenoid URL"
    value: ${{ steps.expose.outputs.selenoid_url }}
  super_user_token:
    description: "TeamCity super user token"
    value: ${{ steps.token.outputs.super_user_token }}

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"
        cache: maven

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y curl jq maven
        echo "MVN_CMD=mvn" >> "$GITHUB_ENV"

    - name: Start Selenoid
      shell: bash
      run: |
        set -e
        docker rm -f selenoid >/dev/null 2>&1 || true
        
        # Pull the Selenoid image first
        echo "Pulling Selenoid image..."
        docker pull aerokube/selenoid:latest-release
        
        # Pull browser images
        echo "Pulling browser images..."
        docker pull selenoid/chrome:128.0 || echo "Chrome image pull failed, will try during session"
        docker pull selenoid/firefox:110.0 || echo "Firefox image pull failed, will try during session"
        
        docker run -d --rm --name selenoid \
          -p 4444:4444 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$GITHUB_WORKSPACE/config/browsers.json:/etc/selenoid/browsers.json:ro" \
          -v /opt/selenoid/video:/opt/selenoid/video \
          -v /opt/selenoid/logs:/opt/selenoid/logs \
          aerokube/selenoid:latest-release \
          -listen :4444 \
          -session-attempt-timeout 3m \
          -limit 1
        for i in {1..120}; do
          if curl -fsS http://localhost:4444/status | jq -er '.value.ready' >/dev/null 2>&1; then
            echo "Selenoid ready"; break
          fi
          echo "Waiting Selenoid..."; sleep 2
        done

    - name: Run SetupServerTest (complete first-start wizard)
      shell: bash
      run: |
        set -e
        # Debug Selenoid status
        echo "Checking Selenoid status..."
        curl -fsS http://localhost:4444/status | jq '.' || echo "Selenoid status check failed"
        
        # Debug available browsers
        echo "Checking available browsers..."
        curl -fsS http://localhost:4444/status | jq '.browsers' || echo "Browser status check failed"
        
        # Run the test against localhost TeamCity
        "${MVN_CMD}" -B \
          -Dcheckstyle.skip=true \
          -Dselenide.remote="http://localhost:4444/wd/hub" \
          -Dselenide.browser="chrome" \
          -Dselenide.baseUrl="http://localhost:8111" \
          -Dselenide.browserSize="1920x1080" \
          -Dselenide.headless="true" \
          -Dtest='teamcity.ui.SetupServerTest#setupTeamCityServerTest' \
          test

    - name: Force super-login page (token emission)
      shell: bash
      run: |
        for i in {1..120}; do
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8111/login.html?super=1" || true)
          [ "$code" = "200" ] && { echo "Super login page ready=200"; break; }
          echo "Waiting super login page ($code)..."; sleep 2
        done

    - name: Extract super-user token
      id: token
      shell: bash
      run: |
        TOKEN=$(curl -s "http://localhost:8111/login.html?super=1" | grep -o 'name="superUserToken" value="[^"]*"' | cut -d'"' -f4)
        echo "super_user_token=$TOKEN" >> "$GITHUB_OUTPUT"
        echo "Super-user token: $TOKEN"

    - name: Seed final config.properties
      shell: bash
      run: |
        mkdir -p src/main/resources
        printf '%s\n' \
          'host=localhost:8111' \
          'superUserToken='"${{ steps.token.outputs.super_user_token }}" \
          'remote=http://localhost:4444/wd/hub' \
          > src/main/resources/config.properties
        echo "Final config.properties created with super-user token"

    - name: Expose URLs
      id: expose
      shell: bash
      run: |
        echo "teamcity_url=http://localhost:8111" >> "$GITHUB_OUTPUT"
        echo "base_url=http://localhost:8111" >> "$GITHUB_OUTPUT"
        echo "selenoid_url=http://localhost:4444" >> "$GITHUB_OUTPUT"